sonar.projectKey=jgpt
sonar.projectName=JGPT
sonar.sources=src/main/java,src/main/resources,scripts
sonar.tests=src/test/java
sonar.java.source=25
sonar.java.binaries=target/classes
sonar.exclusions=index.html,**/target/**,**/state/**,**/data/**

# Structural noise on this GPU/JNI codebase — not product defects.
# Cursor/VS Code SonarLint: see .vscode/settings.json (this file is for sonar-scanner only).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# Gpu vs GPU method aliases (JNI + Java wrappers)
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1845
sonar.issue.ignore.multicriteria.e1.resourceKey=**/TensorOpsGPU.java

# 8+ parameters is normal for matmul/CE/attention kernels
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.java

# Cognitive complexity of train/decoder/BPE is inherent
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.java

# (long) size*bytes casts prevent int overflow
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S2184
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.java

# Wq/Wk field names
sonar.issue.ignore.multicriteria.e5.ruleKey=java:S116
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.java

# Wq/Wk and similar math locals
sonar.issue.ignore.multicriteria.e6.ruleKey=java:S117
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.java
